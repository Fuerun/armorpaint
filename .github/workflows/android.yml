name: Android Build
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generate Android project
        run: |
          cd paint
          chmod +x ../base/make
          ../base/make --target android

      - name: Inspect generated Gradle config
        working-directory: paint/build/ArmorPaint
        run: |
          echo "=== gradle-wrapper.properties (if present) ==="
          cat gradle/wrapper/gradle-wrapper.properties 2>/dev/null || echo "not present"
          echo "=== root build.gradle / build.gradle.kts ==="
          cat build.gradle 2>/dev/null || cat build.gradle.kts 2>/dev/null
          echo "=== app build.gradle / build.gradle.kts ==="
          cat app/build.gradle 2>/dev/null || cat app/build.gradle.kts 2>/dev/null
          echo "=== settings.gradle(.kts) ==="
          cat settings.gradle 2>/dev/null || cat settings.gradle.kts 2>/dev/null

      - name: Regenerate Gradle wrapper
        working-directory: paint/build/ArmorPaint
        run: gradle wrapper

      - name: Build APK
        working-directory: paint/build/ArmorPaint
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-debug-apk
          path: 'paint/build/ArmorPaint/**/outputs/apk/debug/*.apk'
