name: Inspect Repo
on: workflow_dispatch

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: armory3d/armortools
          submodules: recursive

      - name: List root
        run: |
          echo "=== Root contents ==="
          ls -la
          echo "=== .gitmodules ==="
          cat .gitmodules 2>/dev/null || echo "no .gitmodules file"
          echo "=== Find gradlew anywhere ==="
          find . -iname "gradlew" 2>/dev/null
          echo "=== Find android-related folders ==="
          find . -maxdepth 3 -iname "*android*" 2>/dev/null
