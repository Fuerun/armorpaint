name: Android Build
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install SDK/NDK/CMake components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;4.0.2"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Generate Android project
        run: |
          cd paint
          chmod +x ../base/make
          ../base/make --target android

      - name: Configure local.properties
        working-directory: paint/build/ArmorPaint
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/29.0.14206865" >> local.properties

      - name: Regenerate Gradle wrapper
        working-directory: paint/build/ArmorPaint
        run: gradle wrapper --gradle-version 8.13

      - name: Build APK
        working-directory: paint/build/ArmorPaint
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-debug-apk
          path: 'paint/build/ArmorPaint/**/outputs/apk/debug/*.apk'
